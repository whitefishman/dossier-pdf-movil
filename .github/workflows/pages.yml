name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Comprobar disponibilidad de PDF.js
        run: |
          curl --fail --silent --show-error --location --output /dev/null \
            https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs
          curl --fail --silent --show-error --location --output /dev/null \
            https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs

      - name: Verificar la implementación de Preparar envío
        run: |
          grep -F 'import { createPrepareSend } from "./prepare-send.js?v=15";' app.js
          grep -F 'export function createPrepareSend(options)' prepare-send.js
          grep -F 'grid-template-columns: repeat(2' prepare-send.css
          grep -F 'const CACHE_NAME = "dossier-pdf-v15"' service-worker.js
          printf '{"commit":"%s","branch":"%s"}\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > deployment-version.json

      - name: Preparar los archivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
