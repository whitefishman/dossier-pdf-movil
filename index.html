<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f1e8" />
    <meta name="description" content="Abre y lee tus documentos PDF, página a página." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Dossier PDF</title>
  </head>
  <body>
    <main class="app-shell">
      <section id="welcome" class="welcome" aria-labelledby="app-title">
        <header class="brand">
          <span class="brand-mark" aria-hidden="true">D</span>
          <span>Dossier PDF</span>
        </header>

        <div class="welcome-content">
          <p class="eyebrow">TU LECTOR PERSONAL</p>
          <h1 id="app-title">Documentos,<br /><em>sin distracciones.</em></h1>
          <p class="intro">Abre un PDF de tu teléfono y léelo con la calma que merece.</p>

          <label class="file-button" for="pdf-file">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4" /></svg>
            <span>Seleccionar PDF</span>
          </label>
          <input id="pdf-file" type="file" accept="application/pdf,.pdf" />
          <p class="privacy"><span aria-hidden="true">●</span> Tu archivo no sale de este dispositivo</p>
        </div>

        <div class="document-motif" aria-hidden="true">
          <span class="sheet sheet-back"></span>
          <span class="sheet sheet-front"><i></i><i></i><i></i><b>PDF</b></span>
        </div>
      </section>

      <section id="reader" class="reader" aria-label="Lector de PDF" hidden>
        <header class="reader-header">
          <button id="close-file" class="icon-button" type="button" aria-label="Cerrar documento">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
          </button>
          <div class="document-info">
            <strong id="document-name">Documento</strong>
            <span>PDF</span>
          </div>
          <label class="icon-button" for="pdf-file" aria-label="Abrir otro documento">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5V8a2 2 0 0 1 2-2h4l2-2h6a2 2 0 0 1 2 2v13.5M3 19.5h18" /></svg>
          </label>
        </header>

        <div id="page-stage" class="page-stage" aria-live="polite">
          <div id="loading" class="loading" role="status">
            <span class="spinner"></span>
            <span>Preparando documento…</span>
          </div>
          <div id="page-wrap" class="page-wrap">
            <canvas id="pdf-canvas" aria-label="Página del documento"></canvas>
          </div>
          <div id="error-message" class="error-message" role="alert" aria-live="assertive" hidden>
            <strong>No se pudo abrir el documento</strong>
            <span id="error-detail"></span>
            <label class="error-action" for="pdf-file">Elegir otro PDF</label>
          </div>
        </div>

        <div class="bottom-bar">
          <div class="reader-status" aria-live="polite">
            <span>Página <strong><span id="current-page">1</span> de <span id="total-pages">1</span></strong></span>
            <span class="selection-count"><i aria-hidden="true"></i><strong id="selected-count">0</strong> seleccionadas</span>
          </div>
          <div class="reader-actions">
            <button id="select-and-continue" class="action-button action-button-primary" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6" /></svg>
              <span>Seleccionar y continuar</span>
            </button>
            <button id="continue" class="action-button action-button-secondary" type="button">
              <span>Continuar</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
            </button>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
